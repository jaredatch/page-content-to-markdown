name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          MFT="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MFT" ]; then
            echo "Version mismatch — tag=$TAG, package.json=$PKG, manifest.json=$MFT"
            exit 1
          fi

      - name: Package release artifacts
        run: npm run package

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node scripts/extract-changelog-section.js "$VERSION" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            release/*.zip release/SHA256SUMS
