<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Markdown Settings</h1>
    </header>

    <main class="main">
      <section class="section">
        <h2 class="section-title">Output</h2>

        <div class="setting">
          <label class="setting-label" for="outputMode">Default output</label>
          <select id="outputMode" class="setting-select">
            <option value="clipboard">Copy to clipboard</option>
            <option value="file">Save as file</option>
          </select>
        </div>

        <div class="setting">
          <label class="setting-label checkbox-label" for="includeMetadata">
            <input type="checkbox" id="includeMetadata" checked>
            <span>Include page info (title, URL, date)</span>
          </label>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Formatting</h2>

        <div class="setting">
          <label class="setting-label" for="headingStyle">Heading style</label>
          <select id="headingStyle" class="setting-select">
            <option value="atx"># ATX headings</option>
            <option value="setext">Setext (underline) headings</option>
          </select>
          <div class="setting-hint" id="headingHint"></div>
        </div>

        <div class="setting">
          <label class="setting-label" for="bulletListMarker">Bullet list marker</label>
          <select id="bulletListMarker" class="setting-select">
            <option value="-">- Dash</option>
            <option value="*">* Asterisk</option>
          </select>
          <div class="setting-hint" id="bulletHint"></div>
        </div>

        <div class="setting">
          <label class="setting-label" for="codeBlockStyle">Code block style</label>
          <select id="codeBlockStyle" class="setting-select">
            <option value="fenced">``` Fenced</option>
            <option value="indented">    Indented</option>
          </select>
          <div class="setting-hint" id="codeHint"></div>
        </div>

        <div class="setting">
          <label class="setting-label" for="linkStyle">Link style</label>
          <select id="linkStyle" class="setting-select">
            <option value="inlined">[text](url) Inlined</option>
            <option value="referenced">[text][1] Referenced</option>
          </select>
          <div class="setting-hint" id="linkHint"></div>
        </div>
      </section>

      <section class="section section-actions">
        <button id="resetBtn" class="btn btn-outline">Reset to defaults</button>
      </section>

      <div id="status" class="status hidden"></div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
