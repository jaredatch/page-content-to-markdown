<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Markdown</h1>
    </header>

    <main class="main">
      <div class="options">
        <label class="checkbox-label" for="metadataToggle">
          <input type="checkbox" id="metadataToggle" checked>
          <span>Include page info</span>
        </label>
        <div class="output-toggle" id="outputToggle">
          <button class="toggle-btn active" data-mode="clipboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <button class="toggle-btn" data-mode="file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save
          </button>
        </div>
      </div>

      <div id="xPresets" class="x-presets hidden">
        <div class="section-label">X / Twitter</div>
        <div class="preset-actions">
          <button class="btn btn-preset" data-x-type="single-tweet">
            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="btn-text">Copy Tweet</span>
          </button>
          <button class="btn btn-preset" data-x-type="thread">
            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span class="btn-text">Copy Thread</span>
          </button>
          <button class="btn btn-preset" data-x-type="article">
            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span class="btn-text">Copy Article</span>
          </button>
        </div>
      </div>

      <div class="actions">
        <button id="extractBtn" class="btn btn-primary">
          <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="btn-text">Copy Page as Markdown</span>
        </button>
        <button id="selectBtn" class="btn btn-secondary">
          <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span class="btn-text">Select Elements</span>
        </button>
      </div>

      <div id="selectionActive" class="selection-active hidden">
        <p>Selection mode is active on this page.</p>
        <button id="cancelSelectBtn" class="btn btn-outline">Cancel Selection</button>
      </div>

      <div id="status" class="status hidden">
        <div class="status-icon"></div>
        <div class="status-message"></div>
      </div>

      <div id="progress" class="progress hidden">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <div class="progress-text">Extracting content...</div>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
